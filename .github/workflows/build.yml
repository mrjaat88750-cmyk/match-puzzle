name: Build Godot Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"
          yes | sdkmanager --licenses || true

      - name: Download Godot 4.3
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          echo "$RUNNER_TEMP/godot" >> $GITHUB_PATH

      - name: Install Godot Android Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir templates_temp
          unzip -q templates.tpz -d templates_temp
          cp -r templates_temp/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project
        run: |
          godot --version
          godot --headless --editor --path . --quit

      - name: Export Android Debug APK
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/match-puzzle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Match-Puzzle-Android-APK
          path: build/match-puzzle.apk
          if-no-files-found: error
          retention-days: 14
          
