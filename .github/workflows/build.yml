name: Build Godot Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          if [ -d "/root/.local/share/godot/export_templates" ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/4.3.stable/ || true
          fi

      - name: Create export_presets.cfg automatically
        run: |
          mkdir -p ~/.config/godot
          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/match-puzzle.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          package/unique_name="com.match.puzzle"
          package/name="Match Puzzle"
          package/signed=false
          version/code=1
          version/name="1.0"
          screen/orientation=0
          EOF

      - name: Create build directory
        run: mkdir -p build

      - name: Export Android APK
        run: |
          godot --headless --verbose --export-debug "Android" build/match-puzzle.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Match-Puzzle-Android-APK
          path: build/match-puzzle.apk
          if-no-files-found: error
          retention-days: 14
          
