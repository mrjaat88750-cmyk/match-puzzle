name: "Build Godot Android APK"

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/root/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          echo "Android SDK path configured"

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates" ]; then
            cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          fi

      - name: Create default export preset
        run: |
          mkdir -p ~/.config/godot
          cat << EOF > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/match-puzzle.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_password=""

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          command_line/extra_args=""
          architectures/armv7=false
          architectures/arm64=true
          architectures/x86_64=false
          package/unique_name="com.match.puzzle"
          package/name="Match Puzzle"
          version/code=1
          version/name="1.0"
          screen/orientation=0
          munge_icons=true
          clear_text_http=false
          XR/features_enabled=false
          accessibility/accessibility_support=false
          EOF

      - name: Create build directory
        run: mkdir -p build

      - name: Export Android APK
        run: |
          export ANDROID_HOME=/root/android-sdk
          godot --headless --verbose --export-release "Android" build/match-puzzle.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/match-puzzle.apk
          
